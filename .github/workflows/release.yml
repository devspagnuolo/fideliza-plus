name: Release containers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fideliza-plus-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fideliza-plus-web:${{ github.ref_name }}
