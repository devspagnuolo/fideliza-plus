name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Iniciar homologação em contêineres
        run: docker compose up --build -d
      - name: Aguardar serviços e executar smoke test
        run: |
          for attempt in {1..30}; do
            if npm run smoke; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
