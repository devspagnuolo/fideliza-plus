services:
  - type: web
    name: fideliza-plus-api
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    autoDeployTrigger: commit
    domains:
      - api.fidelizaplus.com.br
    disk:
      name: fideliza-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_PATH
        value: /data/fideliza.db
      - key: BACKUP_DIRECTORY
        value: /data/backups
      - key: AUTO_BACKUP_ENABLED
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://fidelizaplus.com.br,https://www.fidelizaplus.com.br,https://fideliza-plus-web.onrender.com
      - key: BLING_CLIENT_ID
        sync: false
      - key: BLING_CLIENT_SECRET
        sync: false
      - key: ASAAS_ENVIRONMENT
        value: production
      - key: ASAAS_BILLING_ENABLED
        value: true
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_WEBHOOK_URL
        value: https://api.fidelizaplus.com.br/webhooks/asaas
      - key: ASAAS_NOTIFICATION_EMAIL
        value: contato@fidelizaplus.com.br
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Fideliza Plus <contato@fidelizaplus.com.br>
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_PASSWORD_RESET_TEMPLATE
        value: fideliza_password_reset
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: pt_BR
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: PLATFORM_ADMIN_NAME
        value: Rafael
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

  - type: web
    name: fideliza-plus-web
    runtime: static
    domains:
      - fidelizaplus.com.br
      - www.fidelizaplus.com.br
    buildCommand: npm ci && npm run build -w @fideliza/web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.fidelizaplus.com.br"
    envVars:
      - key: VITE_API_URL
        value: https://api.fidelizaplus.com.br
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
