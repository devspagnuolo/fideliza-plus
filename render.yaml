services:
  - type: web
    name: fideliza-plus-api
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    autoDeployTrigger: commit
    disk:
      name: fideliza-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_PATH
        value: /data/fideliza.db
      - key: BACKUP_DIRECTORY
        value: /data/backups
      - key: AUTO_BACKUP_ENABLED
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://fideliza-plus-web.onrender.com
      - key: BLING_CLIENT_ID
        sync: false
      - key: BLING_CLIENT_SECRET
        sync: false

  - type: web
    name: fideliza-plus-web
    runtime: static
    buildCommand: npm ci && npm run build -w @fideliza/web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://fideliza-plus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
