services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3333
      WEB_ORIGIN: http://localhost:8080
      DATABASE_PATH: /data/fideliza.db
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET com pelo menos 32 caracteres}
    volumes:
      - fideliza_data:/data
    ports:
      - "3333:3333"
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
volumes:
  fideliza_data:
